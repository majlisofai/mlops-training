# Production-readiness acceptance for f1-points-finish (lesson 09, exercises/acceptance).
# Job accept: promote a model with the lesson 04 pipeline, sign its manifest, optionally inject
# a fault, build and run the secured API container, run every gate of the course (accept.py)
# and keep the release dossier. Job ship: waits for the environment "production"; the
# approval there is the human decision, and decide.py records who made it.
name: acceptance

on:
  push:
    paths:
      - "exercises/acceptance/**"
      - ".github/workflows/acceptance.yml"
  workflow_dispatch:
    inputs:
      fault:
        description: "Fault to inject before the acceptance suite runs"
        type: choice
        options: [none, tamper, no-auth, no-evidence]
        default: none
      files:
        description: "Whose app.py and access tests: yours (trainee) or the reference solution"
        type: choice
        options: [trainee, reference]
        default: trainee

permissions:
  contents: read
  actions: read   # lets the ship job read who approved the deployment

env:
  # Each run has its own MLflow server, with its registry in a sqlite file in the workspace.
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  MLFLOW_DISABLE_AGENT_HINT: "1"
  API_URL: http://127.0.0.1:8000
  FAULT: ${{ inputs.fault || 'none' }}
  FILES: ${{ inputs.files || 'trainee' }}

jobs:
  accept:
    name: Acceptance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            exercises/quality-gates/requirements-ci.txt
            exercises/serve-model/requirements-ci.txt
            exercises/acceptance/requirements-ci.txt
      - name: Install packages
        run: pip install -r exercises/acceptance/requirements-ci.txt

      - name: Make throwaway API keys
        run: |
          # New keys for this run only. They live in the runner and die with it: no repository
          # secret is needed. add-mask makes GitHub print *** instead of a key in every log.
          python exercises/acceptance/keys.py
          while IFS='=' read -r name value; do
            case "$name" in
              API_*) echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV" ;;
            esac
          done < .secrets/api.env
          echo "Fault: \`$FAULT\`, files: \`$FILES\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the MLflow server
        run: |
          nohup mlflow server --host 127.0.0.1 --port 5000 \
            --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlartifacts \
            > mlflow-server.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:5000/health; do sleep 1; done'

      - name: 1. Promote the candidate (lesson 04 pipeline)
        run: |
          GATES=exercises/quality-gates/solution/test_gates.py APPROVER=github-actions \
            bash exercises/quality-gates/run_pipeline.sh exercises/quality-gates/candidate.yaml
      - name: 2. Sign the manifest
        run: python exercises/acceptance/manifest.py sign --signer "github-actions (run ${{ github.run_id }})"
      - name: 3. Attach the evidence
        run: |
          if [ "$FAULT" = no-evidence ]; then
            rm -f exercises/acceptance/evidence/model_card.md
            echo "Fault no-evidence: no model card, no subgroup report."
            exit 0
          fi
          python exercises/acceptance/subgroup_check.py
          if [ "$FILES" = reference ]; then
            cp exercises/acceptance/solution/model_card.md exercises/acceptance/evidence/model_card.md
          fi
      - name: 4. Inject the fault
        if: env.FAULT == 'tamper'
        run: python exercises/acceptance/tamper.py --target model

      - name: 5. Build the Docker image
        run: |
          if [ "$FAULT" = no-auth ]; then
            # The fault: someone deploys the lesson 05 image, which has no access control.
            IMAGE=lab09-unsecured:${{ github.sha }}
            docker build -t "$IMAGE" exercises/serve-model
          else
            IMAGE=lab09-api:${{ github.sha }}
            APP=app.py; [ "$FILES" = reference ] && APP=solution/app.py
            docker build -t "$IMAGE" --build-arg APP="$APP" exercises/acceptance
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker image ls "${IMAGE%%:*}"
      - name: 6. Run the container
        run: |
          # --network host: the container reaches MLflow at 127.0.0.1:5000 and answers on 127.0.0.1:8000.
          # --env-file: the keys go in at run time. They are not in the image.
          docker run -d --name lab09-api --network host --env-file .secrets/api.env "$IMAGE"
          if ! timeout 120 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'; then
            docker logs lab09-api; exit 1
          fi
      - name: 7. Acceptance suite
        run: |
          REF=""; [ "$FILES" = reference ] && REF=--reference
          python exercises/acceptance/accept.py --image "$IMAGE" $REF

      - name: Container log
        if: always()
        run: docker logs lab09-api 2>&1 | tail -30 || true
      - name: Upload the release dossier
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-dossier
          path: |
            dossier.md
            dossier.json
            manifest.json
            results/acceptance/
            exercises/acceptance/evidence/
            mlflow.db
            mlflow-server.log
          if-no-files-found: ignore

  ship:
    name: Ship decision
    needs: accept   # only when every gate passed: a blocked release has nothing to approve
    runs-on: ubuntu-latest
    environment: production   # in your fork, add yourself as a required reviewer
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db   # the registry from the accept job
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            exercises/quality-gates/requirements-ci.txt
            exercises/serve-model/requirements-ci.txt
            exercises/acceptance/requirements-ci.txt
      - name: Install packages
        run: pip install -r exercises/acceptance/requirements-ci.txt
      - name: Download the release dossier
        uses: actions/download-artifact@v8
        with:
          name: release-dossier

      - name: Find the approver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approver=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | last // empty' || true)
          if [ -n "$approver" ]; then
            echo "APPROVER=$approver" >> "$GITHUB_ENV"
            echo "VIA=github-environment production (approved by a required reviewer)" >> "$GITHUB_ENV"
            echo "REASON=every gate passed; approved in the environment production after review" >> "$GITHUB_ENV"
          else
            # Without required reviewers GitHub runs this job at once. Say so in the dossier.
            echo "APPROVER=$GITHUB_ACTOR" >> "$GITHUB_ENV"
            echo "VIA=github-environment production, NO REVIEW RECORDED (the environment has no required reviewers; $GITHUB_ACTOR started the run)" >> "$GITHUB_ENV"
            echo "REASON=every gate passed; nobody reviewed the dossier before this job ran" >> "$GITHUB_ENV"
          fi
      - name: 8. Record the decision
        run: python exercises/acceptance/decide.py --decision ship --approver "$APPROVER" --via "$VIA" --reason "$REASON"

      - name: Upload the decided dossier
        uses: actions/upload-artifact@v7
        with:
          name: release-dossier-decided
          path: |
            dossier.md
            dossier.json
