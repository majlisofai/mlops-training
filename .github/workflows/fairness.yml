# Fairness, privacy and transparency check for f1-points-finish (lesson 08, exercises/fairness).
# Promote a candidate with the lesson 04 pipeline, make a prediction log with the lesson 05 API,
# measure the model per subgroup, run the fairness and privacy gates and write the model card.
# The job fails when a fairness or privacy gate fails. The model card is written either way.
name: fairness

on:
  push:
    paths:
      - "exercises/fairness/**"
      - ".github/workflows/fairness.yml"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate file to train, gate, promote and check for fairness"
        type: string
        default: exercises/quality-gates/candidate.yaml

permissions:
  contents: read

env:
  # Each run has its own MLflow server, with its registry in a sqlite file in the workspace.
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  MLFLOW_DISABLE_AGENT_HINT: "1"
  CANDIDATE: ${{ inputs.candidate || 'exercises/quality-gates/candidate.yaml' }}

jobs:
  fairness:
    name: Fairness, privacy and model card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            exercises/quality-gates/requirements-ci.txt
            exercises/fairness/requirements-ci.txt
      - name: Install packages
        run: pip install -r exercises/fairness/requirements-ci.txt

      - name: Start the MLflow server
        run: |
          nohup mlflow server --host 127.0.0.1 --port 5000 \
            --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlartifacts \
            > mlflow-server.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:5000/health; do sleep 1; done'

      - name: 1. Promote the candidate (lesson 04 pipeline)
        run: |
          echo "Candidate file: \`$CANDIDATE\`" >> "$GITHUB_STEP_SUMMARY"
          GATES=exercises/quality-gates/solution/test_gates.py APPROVER=github-actions \
            bash exercises/quality-gates/run_pipeline.sh "$CANDIDATE"

      - name: 2. Make a prediction log (lesson 05 API with logging)
        run: |
          nohup uvicorn logged_api:app --app-dir exercises/fairness --port 8000 > api.log 2>&1 &
          if ! timeout 120 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'; then
            cat api.log; exit 1
          fi
          echo
          python exercises/fairness/send_season.py
          # A client that sends driver_code is refused (422), so nothing reaches the log.
          if python exercises/fairness/send_season.py --with-driver-code; then
            echo "The API accepted driver_code"; exit 1
          fi
          kill %1 || pkill -f "uvicorn logged_api" || true
          wc -l logs/predictions.jsonl

      - name: 3. Fairness report
        id: report
        run: python exercises/fairness/solution/fairness_report.py

      - name: 4. Fairness and privacy gates
        run: python -m pytest exercises/fairness/test_fairness.py exercises/fairness/test_privacy.py -rs --tb=line

      - name: 5. Model card
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: python exercises/fairness/model_card.py

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for f in fairness_gate_report.md fairness_report/fairness_table.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
          if [ -f fairness_report/model_card.md ]; then
            echo "Model card: download the artifact **fairness-dossier** (\`fairness_report/model_card.md\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the fairness dossier
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fairness-dossier
          path: |
            fairness_report/
            fairness_gate_report.*
            gate_report.*
            logs/predictions.jsonl
            mlflow-server.log
          if-no-files-found: ignore
