# Monitoring checks for f1-points-finish in production.
# monitor.py raises an alert when a measurement crosses one of these thresholds.
# README.md shows the measurements behind each number.

model_name: f1-points-finish

# What "normal" looks like: the inputs of the last four races of 2025 (80 entries).
reference: f1/data/scenarios/reference_window.json
numeric_features: [grid, quali_gap_ms, driver_form, team_form, team_dnf_rate, rain_prob]
categorical_features: [circuit_type]

service_health:
  max_rejected_share: 0.01        # the lesson 05 SLO: at most 1 % of requests may fail

input_drift:
  max_mean_shift: 2.0             # |mean - reference mean| in reference standard deviations
  min_spread_ratio: 0.5           # standard deviation / reference standard deviation
  max_spread_ratio: 2.0
  # The same value for all 20 cars in a race: one race always has spread 0, so no spread check.
  per_race_features: [rain_prob]

skew:
  relative_tolerance: 0.01        # served and recomputed may differ by 1 % (rounding)
  max_mismatch_share: 0.05        # alert when more than 5 % of the values of a feature differ

delayed_labels:
  baseline_accuracy: 0.842        # the champion on the 2025 holdout (lesson 04 gates)
  max_accuracy_drop: 0.05         # alert below 0.792
  min_final_label_coverage: 0.9   # alert when more than 10 % of the final labels are missing

prediction_drift:
  expected_share: 0.5             # exactly 10 of the 20 cars score points in every race
  max_share_change: 0.15          # alert outside 0.35 to 0.65
